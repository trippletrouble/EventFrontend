workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"

stages:
  - build
  - test

# ──────────────────────────────────────────────
# Backend
# ──────────────────────────────────────────────

backend-build:
  stage: build
  image: node:20-alpine
  artifacts:
    untracked: true
  script:
    - cd backend
    - npm ci
  #only:
  #  - main
  #  - dev

backend-unit-test:
  stage: test
  image: node:20-alpine
  dependencies:
    - backend-build
  variables:
    POSTGRES_URL: "postgresql://localhost:5432/placeholder"
    NODE_ENV: "test"
    PORT: "3000"
    FRONTEND_URL: "http://localhost:3000"
    OIDC_ISSUER: "placeholder"
    OIDC_CLIENT_ID: "placeholder"
    OIDC_CLIENT_SECRET: "placeholder"
    OIDC_CALLBACK_URL: "placeholder"
    JWT_SECRET: "placeholder"
    JWT_EXPIRATION: "1h"
  script:
    - cd backend
    - npm ci
    - npx prisma generate
    - npm run test:ci
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
  artifacts:
    paths:
      - backend/coverage/
    when: always
    reports:
      junit:
        - backend/junit.xml

# ──────────────────────────────────────────────
# Frontend
# ──────────────────────────────────────────────

frontend-build:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
  artifacts:
    untracked: true

frontend-unit-test:
  stage: test
  image: node:20-alpine
  allow_failure: true
  dependencies:
    - frontend-build
  script:
    - cd frontend
    - npm ci
    - npm run test:ci
    - npm run test:contrast
    - npm run test:a11y
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
  artifacts:
    paths:
      - frontend/coverage/
    when: always
    reports:
      junit:
        - frontend/junit.xml

frontend-lint:
  stage: test
  image: node:20-alpine
  allow_failure: true
  dependencies:
    - frontend-build
  script:
    - cd frontend
    - npm ci
    - ./node_modules/.bin/eslint . --max-warnings 0
    - ./node_modules/.bin/tsc --noEmit
